# Gradle options only - mod and dependency properties live in stonecutter.properties.toml

# Loom's remapper holds a full Minecraft jar in memory per task, and there is one
# per supported version. 2G ran out of heap once all of them remapped at once.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# Caps how many of those remaps run concurrently, which is what bounds peak memory.
org.gradle.workers.max=4